name: pulsedrop

x-pulsedrop-environment: &pulsedrop-environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_INPUT_TOPIC: playback-events
  KAFKA_DLQ_TOPIC: playback-events-dlq
  CLICKHOUSE_JDBC_URL: jdbc:ch://clickhouse:8123/pulsedrop
  CLICKHOUSE_USER: pulsedrop
  CLICKHOUSE_PASSWORD: pulsedrop
  FLINK_CHECKPOINT_PATH: file:///opt/flink/checkpoints

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic playback-events --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic playback-events-dlq --partitions 3 --replication-factor 1
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    environment:
      CLICKHOUSE_DB: pulsedrop
      CLICKHOUSE_USER: pulsedrop
      CLICKHOUSE_PASSWORD: pulsedrop
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping' | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  flink-init:
    image: flink:1.20.1-scala_2.12-java17
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /opt/flink/checkpoints && chown -R 9999:9999 /opt/flink/checkpoints"]
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    restart: "no"

  jobmanager:
    build:
      context: .
      target: flink
    command: jobmanager
    depends_on:
      flink-init:
        condition: service_completed_successfully
    environment:
      <<: *pulsedrop-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: ${FLINK_PARALLELISM:-2}
        execution.checkpointing.dir: file:///opt/flink/checkpoints
    ports:
      - "8081:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  taskmanager:
    build:
      context: .
      target: flink
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      <<: *pulsedrop-environment
      CLICKHOUSE_BATCH_SIZE: ${CLICKHOUSE_BATCH_SIZE:-1000}
      CLICKHOUSE_FLUSH_MS: ${CLICKHOUSE_FLUSH_MS:-1000}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: ${FLINK_PARALLELISM:-2}
    restart: unless-stopped
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints

  job-submit:
    build:
      context: .
      target: flink
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
    environment:
      <<: *pulsedrop-environment
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-2}
      CLICKHOUSE_BATCH_SIZE: ${CLICKHOUSE_BATCH_SIZE:-1000}
      CLICKHOUSE_FLUSH_MS: ${CLICKHOUSE_FLUSH_MS:-1000}
    command: ["/bin/bash", "-ec", "flink run -d -m jobmanager:8081 -c com.rutvapatel.pulsedrop.pipeline.PulseDropJob /opt/flink/usrlib/pulsedrop.jar"]
    restart: "no"

  api:
    build:
      context: .
      target: app
    command: ["api"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      <<: *pulsedrop-environment
      API_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  generator:
    build:
      context: .
      target: app
    command: ["generator"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      job-submit:
        condition: service_completed_successfully
    environment:
      <<: *pulsedrop-environment
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5000}
      GENERATOR_DURATION_SECONDS: ${GENERATOR_DURATION_SECONDS:-0}
    restart: "no"

volumes:
  kafka-data:
  clickhouse-data:
  flink-checkpoints:
